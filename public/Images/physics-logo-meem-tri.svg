<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <filter id="nucleus-glow-tri" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" opacity="0.6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 3 Orbits -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Orbit 1: White (-52°) -->
    <ellipse cx="256" cy="256" rx="200" ry="68"
             transform="rotate(-52 256 256)"
             stroke="#FFFFFF" stroke-width="16" opacity="0.9" />

    <!-- Orbit 2: White (+52°) -->
    <ellipse cx="256" cy="256" rx="200" ry="68"
             transform="rotate(52 256 256)"
             stroke="#FFFFFF" stroke-width="16" opacity="0.9" />

    <!-- Orbit 3: Cyan (Horizontal 0°) -->
    <ellipse cx="256" cy="256" rx="200" ry="68"
             stroke="#06B6D4" stroke-width="16" />

    <!-- Integrated Arabic Letter "م" (Meem) in Pure White -->
    <path d="M 268 190
             A 36 36 0 1 1 268 262
             L 242 262
             C 232 262 228 270 228 286
             L 228 390"
          stroke="#FFFFFF" stroke-width="16" />
  </g>

  <!-- Glowing Nucleus -->
  <circle cx="268" cy="226" r="16" fill="#06B6D4" filter="url(#nucleus-glow-tri)" />
  <circle cx="268" cy="226" r="7" fill="#FFFFFF" />

  <!-- Warm Yellow Electron on horizontal orbit -->
  <circle cx="430" cy="256" r="12" fill="#FBBF24" />
</svg>